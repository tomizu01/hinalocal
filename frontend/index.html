<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hinalive - ゲーム実況支援</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="start-overlay" class="start-overlay">
    <button type="button" id="start-btn">▶ 開始</button>
    <p class="start-hint">クリックすると応援を開始します<br />（ブラウザの自動再生制限のため必要）</p>
  </div>

  <main class="app">
    <div class="game-area"></div>

    <aside class="right-col">
      <section class="mission" id="mission-section">
        <div class="mission-header">
          <span class="mission-label">現在のミッション：</span>
          <button type="button" id="mission-edit-btn" aria-label="編集">✎</button>
        </div>
        <span id="mission-text" class="mission-text"></span>
        <div id="mission-edit" class="mission-edit hidden">
          <input
            type="text"
            id="mission-input"
            placeholder="今日のミッション..."
            autocomplete="off"
          />
          <div class="mission-edit-actions">
            <button type="button" id="mission-save-btn">保存</button>
            <button type="button" id="mission-cancel-btn">キャンセル</button>
          </div>
        </div>
      </section>

      <div class="mission-footer">
        <button type="button" id="shutdown-btn">終了</button>
      </div>

      <div class="right-spacer">
        <span id="status-text" class="status"></span>
      </div>

      <section class="character">
        <img id="character-img" alt="character" />
      </section>
    </aside>

    <section class="bubble">
      <div class="bubble-body">
        <p id="bubble-text"></p>
      </div>
    </section>

    <section class="input-area">
      <form id="player-form">
        <input
          type="text"
          id="player-input"
          placeholder="メッセージを入力..."
          autocomplete="off"
        />
        <button type="submit" id="send-btn">送信</button>
      </form>
      <button type="button" id="mic-btn">🎤 音声入力</button>
      <button type="button" id="auto-btn" aria-pressed="false">AUTO: OFF</button>
      <p id="last-player" class="last-player"></p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
